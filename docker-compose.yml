services:
  backend:
    build:
      context: ./backend
    environment:
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AI_PROVIDER: ${AI_PROVIDER:-bedrock}
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-false}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-5-sonnet-20241022-v2:0}
      STRANDS_ENABLED: ${STRANDS_ENABLED:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
